services:
  mysql:
    image: mysql:8.0
    container_name: dtd_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cleaning
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    volumes:
      - dtd_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: dtd_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dtd_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dtd_backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: cleaning
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: hello@dusttodone.test
      MAIL_FROM_NAME: Dust to Done
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - dtd_backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dtd_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_API_PREFIX: /api/v1
      NEXT_PUBLIC_SITE_NAME: Dust to Done
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  dtd_mysql_data:
  dtd_backend_storage:
